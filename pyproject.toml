[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcp_workflow"
version = "0.1.0"
description = "A GCP Vertex AI Workflow submission tool"
authors = [
  { name = "Enrique G. Ortiz", email = "ortizeg@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "google-cloud-aiplatform>=1.110.0",
    "loguru>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_workflow"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]
