# @package _global_
# ONNX export of best basketball RF-DETR Medium checkpoint.
#
# Produces model.onnx + labels_mapping.json in the output directory.
#
# NOTE: Update CKPT_PATH with the best checkpoint path after training completes.
#
# Usage:
#   pixi run export-basketball-onnx-rfdetr-medium                            # dry run
#   pixi run export-basketball-onnx-rfdetr-medium infra.dry_run=false        # submit

defaults:
  - override /infra: vertex
  - override /task: object_detection

infra:
  project: api-project-562713517696
  service_account: 562713517696-compute@developer.gserviceaccount.com
  job_name: basketball-detector-export-onnx-rfdetr-medium
  staging_bucket: gs://deep-ego-model-training
  location: us-east1
  tensorboard_resource_name: null
  machine_type: n1-standard-4
  accelerator_type: NVIDIA_TESLA_T4
  accelerator_count: 1
  dry_run: true

task:
  docker_image: us-docker.pkg.dev/api-project-562713517696/object-detection-training/object-detection-training:latest

  entrypoint:
    - pixi
    - run
    - "--environment"
    - prod
    - task_manager

  # Pass the checkpoint path via env var to avoid Hydra override grammar
  # issues with '=' in the checkpoint filename.
  # TODO: Update with best checkpoint path after training completes.
  env:
    - name: CKPT_PATH
      value: "/gcs/deep-ego-model-training/ego-training-data/basketball-data/logs/basketball-detector-training-rfdetr-medium/20260305_131744/checkpoints/epoch=39-val/mAP=0.4334.ckpt"

  data_assets:
    train_data: null
    val_data: null
    test_data: null
    output_data:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/eval/onnx-export
      param_name: hydra.run.dir

  overrides: "--config-name train_basketball_rfdetr \
    task=basketball_export_onnx_rfdetr_medium \
    models=rfdetr_medium \
    models.resolution=640 \
    models.positional_encoding_size=40"
