# @package _global_
# SmolVLM2 LoRA fine-tuning on A100-40GB GPU
#
# A100 has 40GB VRAM, 312 bf16 TFLOPS, 1.5 TB/s memory bandwidth.
# Much faster than L4 for QLoRA (memory-bandwidth bound workload).
# batch_size=24 x accumulate_grad_batches=1 = effective batch 24.
#
# Usage:
#   pixi run train-jersey-ocr-smolvlm2-a100                       # dry run
#   pixi run train-jersey-ocr-smolvlm2-a100 infra.dry_run=false   # real submit

defaults:
  - override /infra: vertex
  - override /task: object_detection

infra:
  project: api-project-562713517696
  service_account: 562713517696-compute@developer.gserviceaccount.com
  job_name: jersey-ocr-smolvlm2-a100
  staging_bucket: gs://deep-ego-model-training
  location: us-east1
  tensorboard_resource_name: null
  machine_type: a2-highgpu-1g
  accelerator_type: NVIDIA_TESLA_A100
  accelerator_count: 1
  dry_run: true

task:
  docker_image: us-docker.pkg.dev/api-project-562713517696/classifier-training/classifier-training:latest

  entrypoint:
    - pixi
    - run
    - "--environment"
    - prod
    - python
    - "-m"
    - classifier_training.train

  data_assets:
    train_data: null
    val_data: null
    test_data: null
    data_root:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-jersey-numbers-ocr
      param_name: data.data_root
    output_data:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/classifier-training/logs/
      param_name: hydra.run.dir

  overrides: "--config-name train_jersey_ocr_smolvlm2 \
    logging=none \
    data.batch_size=24 \
    trainer.accumulate_grad_batches=1 \
    trainer.max_epochs=15 \
    callbacks.early_stopping.patience=5"
