# @package _global_
# Evaluate RF-DETR Medium + RF-DETR Small v3 on L4 GPU for comparison.
#
# Compares RF-DETR Medium against RF-DETR Small v3 (best model) on test set.
# Includes FPS benchmarking on L4 GPU.
#
# NOTE: Update rfdetr_medium_onnx_model path after export completes.
#
# Usage:
#   pixi run eval-basketball-rfdetr-medium                           # dry run
#   pixi run eval-basketball-rfdetr-medium infra.dry_run=false       # submit

defaults:
  - override /infra: vertex
  - override /task: object_detection

infra:
  project: api-project-562713517696
  service_account: 562713517696-compute@developer.gserviceaccount.com
  job_name: basketball-detector-eval-rfdetr-medium
  staging_bucket: gs://deep-ego-model-training
  location: us-east1
  tensorboard_resource_name: null
  machine_type: g2-standard-8
  accelerator_type: NVIDIA_L4
  accelerator_count: 1
  dry_run: true

task:
  docker_image: us-docker.pkg.dev/api-project-562713517696/object-detection-training/object-detection-training:latest

  entrypoint:
    - pixi
    - run
    - "--environment"
    - prod
    - task_manager

  env: []

  data_assets:
    train_data: null
    val_data:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/basketball-player-detection-3/valid
      param_name: task.val_dir
    test_data:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/basketball-player-detection-3/test
      param_name: task.test_dir
    rfdetr_onnx_model:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/eval/onnx-export/basketball-detector-best-runs/rfdetr-v3/model.onnx
      param_name: task.onnx_model_path
    rfdetr_label_mapping:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/eval/onnx-export/basketball-detector-best-runs/rfdetr-v3/labels_mapping.json
      param_name: task.label_mapping_path
    output_data:
      bucket_name: deep-ego-model-training
      relative_path: ego-training-data/basketball-data/eval/rfdetr-medium-comparison
      param_name: hydra.run.dir

  overrides: "--config-name train_basketball_rfdetr \
    task=eval_detection \
    task.run_gemini=false \
    task.run_smolvlm2=false \
    task.run_rfdetr=true \
    task.run_yolox=false \
    task.rfdetr_input_size=640"
