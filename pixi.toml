[workspace]
authors = ["Enrique G. Ortiz <ortizeg@gmail.com>"]
channels = ["conda-forge"]
name = "gcp-workflow"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "pytest"
precommit = "pre-commit run --all-files"
train-basketball-player = "python main.py +experiment=basketball-detector-training"
train-basketball-player-yolox = "python main.py +experiment=basketball-detector-training-yolox"
train-jersey-ocr = "python main.py +experiment=jersey-ocr-training"
annotate-metadata = "python main.py +experiment=jersey-ocr-annotate-metadata"
evaluate-jersey-ocr = "python main.py +experiment=jersey-ocr-evaluate"
train-jersey-ocr-smolvlm2 = "python main.py +experiment=jersey-ocr-smolvlm2-training"
train-jersey-ocr-smolvlm2-a100 = "python main.py +experiment=jersey-ocr-smolvlm2-a100"
sweep-jersey-ocr-onnx = "python main.py +experiment=jersey-ocr-sweep-onnx"
sweep-jersey-ocr-vlm = "python main.py +experiment=jersey-ocr-sweep-vlm"
export-basketball-onnx = "python main.py +experiment=basketball-detector-export-onnx"
export-basketball-onnx-yolox = "python main.py +experiment=basketball-detector-export-onnx-yolox"
eval-basketball-comparison = "python main.py +experiment=basketball-detector-eval-comparison"
eval-basketball-zeroshot = "python main.py +experiment=basketball-detector-eval-zeroshot"
eval-basketball-best-runs = "python main.py +experiment=basketball-detector-eval-best-runs"
train-basketball-player-yolox-medium = "python main.py +experiment=basketball-detector-training-yolox-medium"
export-basketball-onnx-yolox-medium = "python main.py +experiment=basketball-detector-export-onnx-yolox-medium"
eval-basketball-yolox-medium = "python main.py +experiment=basketball-detector-eval-yolox-medium"
train-basketball-player-rfdetr-medium = "python main.py +experiment=basketball-detector-training-rfdetr-medium-640"
train-basketball-rfdetr-medium-576 = "python main.py +experiment=basketball-detector-training-rfdetr-medium-576"
export-basketball-onnx-rfdetr-medium = "python main.py +experiment=basketball-detector-export-onnx-rfdetr-medium"
eval-basketball-rfdetr-medium = "python main.py +experiment=basketball-detector-eval-rfdetr-medium"
train-basketball-yolo26s = "python main.py +experiment=basketball-yolo26s-training"
train-basketball-yolo26m = "python main.py +experiment=basketball-yolo26m-training"
export-basketball-yolo26s = "python main.py +experiment=basketball-yolo26s-export-onnx"
export-basketball-yolo26m = "python main.py +experiment=basketball-yolo26m-export-onnx"
eval-basketball-yolo26 = "python main.py +experiment=basketball-yolo26-eval"
eval-basketball-new-models = "python main.py +experiment=basketball-eval-new-models"
eval-basketball-yolo26m = "python main.py +experiment=basketball-eval-yolo26m"
eval-basketball-rfdetr-medium-standalone = "python main.py +experiment=basketball-eval-rfdetr-medium-standalone"
export-basketball-onnx-rfdetr-medium-576 = "python main.py +experiment=basketball-detector-export-onnx-rfdetr-medium-576"
eval-basketball-rfdetr-medium-576 = "python main.py +experiment=basketball-eval-rfdetr-medium-576"

[dependencies]
python = "3.9.*"
hydra-core = ">=1.3.2,<2"
omegaconf = ">=2.3.0,<3"
google-cloud-aiplatform = ">=1.110.0,<2"
loguru = ">=0.7.3,<0.8"
pre-commit = ">=4.3.0,<5"
black = ">=25.1.0,<26"
flake8 = ">=7.3.0,<8"
isort = ">=6.0.1,<7"
pytest = ">=8.4.1,<9"
hatchling = "*"

[pypi-dependencies]
gcp-workflow = { path = ".", editable = true }
